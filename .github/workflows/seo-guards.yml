name: SEO guards

# These run against the deployed site, not against a CI build.
#
# The main CI job builds with placeholder Sanity credentials
# (NEXT_PUBLIC_SANITY_PROJECT_ID: "ci-project"), so a site built there has no
# content: no reviews, no guides, an empty sitemap. Crawling that would prove
# nothing. Every check here needs real rendered pages, so production is the only
# meaningful target.
#
# Runs after a push to main has had time to deploy, on a daily schedule to catch
# CMS-driven regressions that no commit would trigger, and on demand.

on:
  schedule:
    # 07:15 UTC daily, after the content crons at 06:00-08:00.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to check"
        required: false
        default: "https://safenesttoys.com"

concurrency:
  group: seo-guards
  cancel-in-progress: false

jobs:
  guards:
    name: Crawl-time SEO and compliance guards
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://safenesttoys.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each guard runs even if an earlier one fails, so one push surfaces every
      # problem rather than only the first.

      - name: Stale trust claims and content shells
        if: always()
        run: node scripts/audit-stale-claims.mjs "$BASE_URL"

      - name: Prohibited claims in rendered output
        if: always()
        run: node scripts/scan-output-claims.mjs "$BASE_URL"

      - name: >-
          On-page errors (status, title, H1, canonical, duplicates,
          affiliate disclosure)
        if: always()
        run: node scripts/audit-onpage.mjs "$BASE_URL"

      - name: Indexability and canonical consolidation
        if: always()
        run: SAMPLE=all node scripts/check-index-readiness.mjs "$BASE_URL"

      - name: Broken internal links
        if: always()
        run: node scripts/audit-internal-links.mjs "$BASE_URL"

      - name: Orphan pages
        if: always()
        run: node scripts/audit-orphan-pages.mjs "$BASE_URL"

      - name: Review page structure and disclosures
        if: always()
        run: node scripts/verify-review-output.mjs "$BASE_URL"

      - name: Accessibility
        if: always()
        run: node scripts/audit-a11y.mjs "$BASE_URL"

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [guards]
    if: failure()
    steps:
      - name: Send notification
        env:
          ADMIN_WEBHOOK_URL: ${{ secrets.ADMIN_WEBHOOK_URL }}
        run: |
          if [ -n "$ADMIN_WEBHOOK_URL" ]; then
            curl -X POST "$ADMIN_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"SEO guards failed on ${{ github.ref_name }}. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              --max-time 10 || true
          fi
