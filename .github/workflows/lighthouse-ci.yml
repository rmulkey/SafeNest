name: Lighthouse CI

# Runs Lighthouse against the LIVE production site rather than a local build.
# Rationale: the app statically generates pages from Sanity at build time, so a
# CI build requires Sanity credentials. Auditing the deployed URL avoids putting
# those secrets in CI and tests exactly what real users get. Vercel already
# gates deploys, so this acts as a post-deploy quality check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true
